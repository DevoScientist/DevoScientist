name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *" # once a day at 00:00 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab

# Never let two runs overlap: overlapping runs make "git push" get rejected.
concurrency:
  group: profile-summary-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: ${{ github.ref_name }}
          THEME: "tokyonight" # only generate the theme the README uses
          AUTO_PUSH: false # we commit and push ourselves in the next step

      - name: Commit and push the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          git commit -m "chore: update profile summary cards" || echo "Nothing new to commit"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" \
              && exit 0
            echo "Push attempt ${attempt} failed, retrying..."
            sleep 5
          done
          exit 1
